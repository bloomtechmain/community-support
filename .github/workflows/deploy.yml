name: Community Support — Build & Deploy

# Builds the arm64 image on GitHub's runners (never on the 1 GB host),
# pushes it to ECR, then has the host pull and restart it via SSM Run Command.
# The host has no SSH port open; SSM is the only way in.
#
# Repo settings this needs (Settings → Secrets and variables → Actions):
#   secrets.AWS_ROLE_ARN   — IAM role GitHub assumes via OIDC (ECR push + ssm:SendCommand)
#   vars.AWS_REGION        — ap-southeast-1
#   vars.INSTANCE_ID       — the community-support EC2 instance id

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-community-support
  cancel-in-progress: false

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Backend install
        working-directory: backend
        run: npm ci --omit=dev && node --check server.js

  deploy:
    name: Build image & deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build & push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/community-support:sha-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/community-support:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on the host via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
        run: |
          set -euo pipefail
          COMPOSE_B64=$(sed "s|\${ECR_REGISTRY}|${REGISTRY}|g" deploy/docker-compose.yml | base64 -w0)
          CADDY_B64=$(base64 -w0 deploy/Caddyfile)

          # Keeps the host copies of compose/Caddyfile identical to the repo,
          # pulls the new image, restarts only what changed, then waits for
          # the app's own /health before calling the deploy good.
          jq -n --arg c "$COMPOSE_B64" --arg f "$CADDY_B64" --arg r "$REGISTRY" --arg region "$REGION" '{commands: [
            "set -e",
            "cd /opt/community-support",
            ("echo " + $c + " | base64 -d > docker-compose.yml"),
            ("echo " + $f + " | base64 -d > Caddyfile"),
            ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $r),
            "docker compose pull app",
            "docker compose up -d",
            "docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true",
            "for i in $(seq 1 30); do docker exec community-support wget -qO- http://127.0.0.1:5100/health && exit_ok=1 && break; sleep 2; done; [ \"${exit_ok:-}\" = 1 ]",
            "docker image prune -f",
            "docker compose ps"
          ]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "community-support ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          [ "$STATUS" = "Success" ]

      - name: Public health check
        run: |
          for i in $(seq 1 10); do
            curl -fsS https://community.bloomaudit.com/health && exit 0
            sleep 6
          done
          exit 1
